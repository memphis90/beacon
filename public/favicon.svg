<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Variante compatta del marchio: il faro senza fasci e senza orizzonte.
       A 16px due trattini obliqui non si leggono come luce, si leggono come
       sporco, e la linea dell'orizzonte tocca il bordo della pastiglia.
       Il tratto è più spesso che nel marchio grande: a questa dimensione
       1.9px sparisce. Fondo navy pieno perché una favicon trasparente
       sparisce sulle barre scure del browser. -->
  <rect width="32" height="32" rx="7" fill="#203b52"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.6 25.6 12.6 13.4"/>
    <path d="M22.4 25.6 19.4 13.4"/>
    <path d="M11.2 13.4h9.6"/>
    <path d="M12 7.8 16 4 20 7.8"/>
  </g>
  <circle cx="16" cy="10.4" r="2" fill="#f59e0b"/>
</svg>
